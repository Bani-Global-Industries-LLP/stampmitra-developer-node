name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Bani-Global-Industries-LLP/stampmitra-developer-openapi
          path: .spec-repo
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          STAMPMITRA_SPEC_DIR: ${{ github.workspace }}/.spec-repo
      - run: npm run build
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Inert until the maintainer sets the repository variable NPM_PUBLISH=true (see RELEASING.md).
      - name: Publish to npm (provenance)
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: npm publish --provenance --access public
